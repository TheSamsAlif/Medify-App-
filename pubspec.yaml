name: medicare_plus
description: A Medify Patient and Caretaker management application in Flutter.
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  get: ^4.6.6
  google_fonts: ^6.1.0
  fl_chart: ^0.66.0
  firebase_core: ^3.1.0
  firebase_auth: ^5.1.0
  cloud_firestore: ^5.0.0
  shared_preferences: ^2.2.3
  image_picker: ^1.1.2
  http: ^1.2.1
  audioplayers: ^5.2.1
  flutter_local_notifications: ^17.1.2
  timezone: ^0.9.2
  flutter_image_compress: ^2.3.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "Assets/medify.png"

flutter:
  uses-material-design: true
  assets:
    - Assets/
